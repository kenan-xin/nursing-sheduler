        style: primary
        start: 13
        end: 54
  ? |
    const cls = "shadow-[var(--sh-1)]";
  : labels:
      - source: shadow-[var(--sh-1)]
        style: primary
        start: 13
        end: 33
  ? |
    const cls = "shadow-md";
  : labels:
      - source: shadow-md
        style: primary
        start: 13
        end: 22
