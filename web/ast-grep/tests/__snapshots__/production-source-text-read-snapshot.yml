id: production-source-text-read
snapshots:
  ? |
    const handle = openSync(join(ROOT, "lib/store/spine.ts"));
  : labels:
      - source: openSync(join(ROOT, "lib/store/spine.ts"))
        style: primary
        start: 15
        end: 57
  ? |
    const source = readFileSync(join(ROOT, "app/layout.tsx"), "utf8");
    const owners = source.match(/className="([^"]+)"/g);
  : labels:
      - source: readFileSync(join(ROOT, "app/layout.tsx"), "utf8")
        style: primary
        start: 15
        end: 65
