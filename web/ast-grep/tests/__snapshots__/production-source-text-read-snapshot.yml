        start: 15
        end: 68
  ? |
    const text = await readFile(join(ROOT, "components/shell/top-bar.tsx"), "utf8");
  : labels:
      - source: readFile(join(ROOT, "components/shell/top-bar.tsx"), "utf8")
        style: primary
        start: 19
        end: 79
  ? |
    const text = readFileSync("lib/store/authority.ts", "utf8");
  : labels:
      - source: readFileSync("lib/store/authority.ts", "utf8")
        style: primary
