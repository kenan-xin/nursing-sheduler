id: surface-legal-class-vocabulary
language: Tsx
# THE LEGAL SURFACE CLASS VOCABULARY — a fail-closed ALLOWLIST, not a denylist.
#
# WHY A UTIL. This is the vocabulary the deleted 4,040-line analyzer enforced in
# `classifyToken`: a consumer's className on the surface authority is layout,
# position, overflow and sizing ONLY. Everything else — paint, motion, typography,
# interaction, visibility, fragmentation, and EVERY arbitrary `[…]` / `(…)` value on
# every family — is rejected because it is absent from this list, not because someone
# remembered to enumerate it. That is the difference between a contract that fails
# closed and a denylist that silently admits whatever nobody thought of: `visible`,
# `box-decoration-clone` and `[mask-type:luminance]` are rejected here by construction.
#
# It lives in `utilDirs` so the vocabulary is defined ONCE and referenced by
# `matches: surface-legal-class-vocabulary` from every rule that governs a surface class channel. A rule that
# copied the regex could drift from its twin; a rule that references it cannot.
#
# SHAPE. The regex matches a WHOLE className string that is entirely legal:
#
#   ^ space* ( TOKEN ( space+ TOKEN )* space* )? $
#   TOKEN   = ( VARIANT: )* !? -? BASE !?
#   VARIANT = any non-space run, or a bracketed segment (`data-[state=open]:`)
#   BASE    = one of the ~43 valueless layout utilities, or a FAMILY-value pair whose
#             value is validated (named value, numeric step, fraction, or span-N)
#
# Callers wrap it in `not:`, so a string is a FINDING when it is not wholly legal.
# Variant prefixes are stripped exactly as `splitVariants` did (bracket-aware), and
# a leading/trailing `!` plus a leading `-` are stripped as `normalizeBase` did — so
# `hover:flex`, `-mt-2` and `flex!` stay legal while `hover:bg-panel` does not.
#
# GENERATED FROM the vocabulary of the deleted analyzer (`EXACT` + `FAMILIES` +
# `classifyToken` in `components/ui/surface-contract.test.ts` at HEAD 94c04022). The
# regex is data, not code: it has no backtracking, no evaluator and no symbol table.
# Its boundary is pinned by the valid/invalid fixtures in
# `ast-grep/tests/surface-consumer-classname-test.yml`, which carry the exact tokens
# the analyzer's own `classifyToken` suite pinned.
