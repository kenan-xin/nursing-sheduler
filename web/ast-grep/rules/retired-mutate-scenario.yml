id: retired-mutate-scenario
language: TypeScript
severity: error
message: >-
  `mutateScenario` is the retired "patch live state and let persist catch up" action.
  Nothing replaces it under that name: durable scenario changes go through
  `scenarioCommands`, and the projection is written only by the adapter, after the commit.
note: >-
  Migrated from `lib/store/authority-boundary.test.ts`, where ticket 2 had to RETAIN it.
  Alternatives checked and rejected: Oxlint `no-restricted-imports` binds to a module
  specifier and this is not one; `no-restricted-properties` binds to a property on a named
  identifier receiver and this is a bare identifier; TypeScript cannot forbid a name that
  no longer resolves to anything, because a half-migrated call site is already an error
  for a DIFFERENT reason and a string key is not an error at all. The remaining contract
  is authored-source, so it lands here.
files:
  - "app/**"
  - "components/**"
  - "lib/**"
  - "e2e/**"
ignores:
  - "lib/store/persistence.test.ts"
rule:
  any:
    - kind: identifier
      regex: ^mutateScenario$
    - kind: property_identifier
      regex: ^mutateScenario$
    - kind: string_fragment
      regex: ^mutateScenario$
