id: test-module-loader-call
language: TypeScript
severity: error
message: >-
  `createRequire` builds a generic module loader: the value it returns resolves and loads
  arbitrary paths, which is the same capability as `fs` reached by another route. It is
  available only to the exact package-resolution exceptions in the reader ledger, which may
  resolve DECLARED package ids and must not hand a generic loader back to their callers.
note: >-
  Custom-AST ticket 6. Oxlint closes the `node:module` SPECIFIER in test/support scope and is
  the primary mechanism; this rule closes the CALL, which is what survives when the function
  arrives some other way -- re-exported by a helper, pulled off a namespace import, or
  destructured from a value the specifier rule never saw.
  .
  It is a separate rule from `test-capability-acquisition` for one reason: its exception list
  is not empty, and merging the two would mean the three files below silently gained a
  dynamic-`fs` allowance they do not need. Keeping them apart makes this `ignores` list the
  complete, readable answer to "who may build a loader here", which is a question a reviewer
  actually asks.
  .
  THE THREE EXCEPTIONS, and what each is scoped to by review rather than by this rule:
  `model-visible-tools.test.ts` resolves `@copilotkit/*` package entry points to compare the
  installed tool-conversion surface; `package-family.test.ts` resolves the root
  `package.json` plus the locked `@copilotkit/runtime` manifest to pin the package family;
  `assistant-styles.test.ts` resolves `@copilotkit/react-core`'s own `exports` map to find
  the stylesheet `app/layout.tsx` imports, rather than guessing its `dist/` path.
  .
  WHAT THIS RULE CANNOT DO. It cannot bound WHAT an exempt file resolves -- "declared package
  ids only" is a review obligation inside those three files, not a syntactic property this
  matcher can check. Ledger requirement 3 states it, and this note repeats it rather than
  letting the rule's existence imply more than it proves.
files:
  - "**/*.test.*"
  - "**/*.spec.*"
  - "**/*.test-d.*"
  - "e2e/**"
  - "**/__tests__/**"
  - "**/support/**"
  - "**/test-support/**"
  - "**/test-support.*"
  - "**/*.test-support.*"
  - "lib/store/test-authority.ts"
ignores:
  - "components/ai/assistant-styles.test.ts"
  - "lib/ai/runtime/model-visible-tools.test.ts"
  - "lib/ai/runtime/package-family.test.ts"
rule:
  any:
    - pattern: createRequire($$$)
    - pattern: $MOD.createRequire($$$)
