id: tailwind-default-palette-utility
language: TypeScript
severity: error
message: >-
  This is a Tailwind DEFAULT-palette utility. The v2 ink ramp is warm espresso and the
  planes are a cool recessed mint; there is no `black`, no `white` and no `slate-500` in
  either. Reach for the semantic token family instead (`bg-surface`, `text-ink2`,
  `border-line`, `bg-errortint`).
note: >-
  Migrated from the `-black` utility family in the TSX half of
  `app/v2-style-contract.test.ts` and the `components/ui/**` palette sweep in
  `app/design-system.test.ts`. Alternatives checked and rejected: the utility resolves to
  real paint, so a computed-style test sees a colour but cannot say whether it came from
  the default palette or from a token that happens to be close; and Oxlint has no rule that
  inspects the CONTENTS of a class-list string. The `/<digits>` opacity suffix is matched
  but a `/*` glob is NOT, so the guide's own prose about `bg-black/*` being off-contract
  stays legal -- the same discrimination the retired scanner made.
  VARIANT PREFIXES (bounded-review round 1). The prefix segment is `[^[:space:]]*:`, not
  `[-a-z0-9]+:`. The narrower form silently accepted every BRACKETED Tailwind variant --
  `data-[state=open]:bg-black` produced zero diagnostics -- and bracketed variants are
  ordinary spellings in this repository (`data-[pressed]:`, `group-data-[checked]/switch:`,
  `[&_svg]:`). The retired scanner stripped everything through the LAST colon before judging
  the terminal utility, which is exactly what a greedy non-space prefix does. It is still a
  syntax pattern: nothing here parses a variant, it only declines to care what is left of
  the final colon.
files:
  - "app/**"
  - "components/**"
ignores:
  - "**/*.test.ts"
  - "**/*.test.tsx"
  - "**/*.test-d.ts"
  - "**/*.spec.ts"
  - "**/*.spec.tsx"
  # EXACT EXCEPTION, one file, recorded rather than widened. `AGGREGATE_SIGN_REFERENCE`
  # in this module is dead reference data: it is exported, has no consumer anywhere in the
  # tree, and its own doc comment says it documents the OLD app's non-binding tokens. It
  # therefore paints nothing, which is why it survived until this rule widened the palette
  # sweep past `components/ui/**`. Removing it is a change to unrelated production code and
  # is filed as follow-up work rather than folded into this migration.
  - "components/requests/requests-model.ts"
rule:
  kind: string_fragment
  regex: "(^|[[:space:]])([^[:space:]]*:)?!?(bg|text|border|ring|fill|stroke|from|to|via|outline|decoration|shadow|caret|accent|divide|placeholder)-(white|black|slate|gray|zinc|neutral|stone|red|orange|amber|yellow|lime|green|emerald|teal|cyan|sky|blue|indigo|violet|purple|fuchsia|pink|rose)(-[0-9]{2,3})?(/[0-9]{1,3})?([[:space:]]|$)"
