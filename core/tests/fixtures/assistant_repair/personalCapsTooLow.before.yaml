apiVersion: alpha
dates:
  range:
    startDate: 2026-11-01
    endDate: 2026-11-07
people:
  items:
    - id: ana
    - id: ben
shiftTypes:
  items:
    - id: D
      description: Day
    - id: N
      description: Night
preferences:
  - type: at most one shift per day
  - type: shift type requirement
    description: night
    shiftType:
      - N
    requiredNumPeople: 1
    qualifiedPeople:
      - ALL
    date:
      - ALL
    weight: -1
  - type: shift count
    description: At most 3 nights
    person:
      - ana
    countDates:
      - ALL
    countShiftTypes:
      - N
    expression: x <= T
    target: 3
    weight: .inf
  - type: shift count
    description: At most 3 nights
    person:
      - ben
    countDates:
      - ALL
    countShiftTypes:
      - N
    expression: x <= T
    target: 3
    weight: .inf
