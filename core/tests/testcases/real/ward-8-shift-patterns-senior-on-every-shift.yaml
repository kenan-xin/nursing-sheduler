preferences:
  - type: at most one shift per day

  # ----------------------------------------------------------------- staffing --
  # Two requirements per shift pattern. The first fills the open slots; the second
  # reserves one slot for a Senior Staff Nurse, using qualifiedPeople so only an
  # SSN can take it. Splitting it this way makes "every shift has a senior on it"
  # true by construction, rather than something the finished roster has to be
  # checked for.
  - type: shift type requirement
    description: Early morning am1 (08:00-15:00) needs 1 nurse of any grade
    shiftType: am1
    requiredNumPeople: 1
    date: ALL
  - type: shift type requirement
    description: Early morning am1 (08:00-15:00) also needs exactly 1 Senior Staff Nurse
    shiftType: am1+
    requiredNumPeople: 1
    qualifiedPeople: [SeniorStaffNurses]
    date: ALL

  - type: shift type requirement
    description: Morning am2 (08:00-16:00) needs 2 nurses of any grade
    shiftType: am2
    requiredNumPeople: 2
    date: ALL
  - type: shift type requirement
    description: Morning am2 (08:00-16:00) also needs exactly 1 Senior Staff Nurse
    shiftType: am2+
    requiredNumPeople: 1
    qualifiedPeople: [SeniorStaffNurses]
    date: ALL

  - type: shift type requirement
    description: Extended morning am3 (08:00-17:00) needs 1 nurse of any grade
    shiftType: am3
    requiredNumPeople: 1
    date: ALL
  - type: shift type requirement
    description: Extended morning am3 (08:00-17:00) also needs exactly 1 Senior Staff Nurse
    shiftType: am3+
    requiredNumPeople: 1
    qualifiedPeople: [SeniorStaffNurses]
    date: ALL

  - type: shift type requirement
    description: Early afternoon pm1 (12:00-21:00) needs 1 nurse of any grade
    shiftType: pm1
    requiredNumPeople: 1
    date: ALL
  - type: shift type requirement
    description: Early afternoon pm1 (12:00-21:00) also needs exactly 1 Senior Staff Nurse
    shiftType: pm1+
    requiredNumPeople: 1
    qualifiedPeople: [SeniorStaffNurses]
    date: ALL

  - type: shift type requirement
    description: Afternoon pm2 (13:00-21:00) needs 2 nurses of any grade
    shiftType: pm2
    requiredNumPeople: 2
    date: ALL
  - type: shift type requirement
    description: Afternoon pm2 (13:00-21:00) also needs exactly 1 Senior Staff Nurse
    shiftType: pm2+
    requiredNumPeople: 1
    qualifiedPeople: [SeniorStaffNurses]
    date: ALL

  - type: shift type requirement
    description: Late afternoon pm3 (14:00-21:00) needs 1 nurse of any grade
    shiftType: pm3
    requiredNumPeople: 1
    date: ALL
  - type: shift type requirement
    description: Late afternoon pm3 (14:00-21:00) also needs exactly 1 Senior Staff Nurse
    shiftType: pm3+
    requiredNumPeople: 1
    qualifiedPeople: [SeniorStaffNurses]
    date: ALL

  - type: shift type requirement
    description: Long day (08:00-20:30) needs 1 nurse of any grade
    shiftType: long
    requiredNumPeople: 1
    date: ALL
  - type: shift type requirement
    description: Long day (08:00-20:30) also needs exactly 1 Senior Staff Nurse
    shiftType: long+
    requiredNumPeople: 1
    qualifiedPeople: [SeniorStaffNurses]
    date: ALL

  - type: shift type requirement
    description: Night (20:00-08:30) needs 3 nurses of any grade
    shiftType: night
    requiredNumPeople: 3
    date: ALL
  - type: shift type requirement
    description: Night (20:00-08:30) also needs exactly 1 Senior Staff Nurse
    shiftType: night+
    requiredNumPeople: 1
    qualifiedPeople: [SeniorStaffNurses]
    date: ALL

  # -------------------------------------------- 11-hour break between shifts --
  # The solver works in whole days and ignores the clock times declared above, so
  # every hours-based rule has to be restated as "this run of days is banned".
  # The gaps below were worked out from those clock times; change a start or end
  # time and these rules stop meaning what they say.
  - type: shift type successions
    description: >-
      A nurse who finishes at 20:30 or 21:00 must not start again at 08:00 the
      next morning. That leaves exactly 11 hours off - the bare legal floor, and
      too little once travel, sleep and handover are taken out of it.
    person: ALL
    date: ALL
    pattern: [FinishesLate, StartsAt0800]
    weight: -.inf

  - type: shift type successions
    description: >-
      The day after a night shift must be another night or a day off. A night
      finishes at 08:30, so any day shift on that same date would start before
      the nurse has even left (08:00) or give only 3 to 5 hours off.
    person: ALL
    date: ALL
    pattern: [AllNights, AnyDayShift]
    weight: -.inf

  # --------------------------------------- 48-hour recovery after night duty --
  # The rule above already keeps the first day after a run of nights clear. These
  # keep the second day clear too, and then stop the nurse from taking an 08:00
  # start on the third day: measured from the 08:30 night finish that would be
  # 47.5 hours, half an hour short of the 48 a night run requires. An afternoon
  # start on the third day is 51.5 hours and is allowed.
  #
  # There is no "not a night" token, so each rule below spells out one of the two
  # ways a nurse can be non-working: a rest day (OFF) or annual leave (LEAVE).
  - type: shift type successions
    description: A run of nights is followed by a second clear day - rest-day case
    person: ALL
    date: ALL
    pattern: [AllNights, OFF, ALL]
    weight: -.inf
  - type: shift type successions
    description: A run of nights is followed by a second clear day - annual-leave case
    person: ALL
    date: ALL
    pattern: [AllNights, LEAVE, ALL]
    weight: -.inf

  - type: shift type successions
    description: No 08:00 start on the third day after nights (47.5 h) - rest, rest
    person: ALL
    date: ALL
    pattern: [AllNights, OFF, OFF, StartsAt0800]
    weight: -.inf
  - type: shift type successions
    description: No 08:00 start on the third day after nights (47.5 h) - rest, leave
    person: ALL
    date: ALL
    pattern: [AllNights, OFF, LEAVE, StartsAt0800]
    weight: -.inf
  - type: shift type successions
    description: No 08:00 start on the third day after nights (47.5 h) - leave, rest
    person: ALL
    date: ALL
    pattern: [AllNights, LEAVE, OFF, StartsAt0800]
    weight: -.inf
  - type: shift type successions
    description: No 08:00 start on the third day after nights (47.5 h) - leave, leave
    person: ALL
    date: ALL
    pattern: [AllNights, LEAVE, LEAVE, StartsAt0800]
    weight: -.inf

  # ------------------------------------------------- weekly rest and workload --
  - type: shift type successions
    description: >-
      Never seven days of work in a row, so every nurse gets a rest day in any
      seven-day stretch. Because nothing finishes later than 21:00 and nothing
      starts earlier than 08:00, a single rest day is always worth at least 35
      unbroken hours - comfortably over the 30 hours a statutory rest day needs.
    person: ALL
    date: ALL
    pattern: [ALL, ALL, ALL, ALL, ALL, ALL, ALL]
    weight: -.inf

  - type: shift type successions
    description: At most three nights in a row
    person: ALL
    date: ALL
    pattern: [AllNights, AllNights, AllNights, AllNights]
    weight: -.inf

  # ------------------------------------------------------- contracted hours --
  # Counted in half-hours, so 304 to 336 means 152 to 168 paid hours over the
  # four weeks - 38 to 42 hours a week, averaging the contracted 40. A range
  # rather than a fixed number because the eight shift patterns are different
  # lengths (6.5 to 11.5 hours), so an exact total would only be reachable for
  # certain combinations of shifts.
  #
  # Approved leave is credited here too, at 16 half-hours (8 h) a day, which is
  # how a nurse on leave still meets contract without working.
  - type: shift count
    description: Each nurse is credited 152 to 168 paid hours over the four weeks
    person: ALL
    countDates: ALL
    countShiftTypes: [am1, am1+, am2, am2+, am3, am3+, pm1, pm1+, pm2, pm2+, pm3, pm3+, long, long+, night, night+, LEAVE]
    countShiftTypeCoefficients:
      - [am1, 13]
      - [am1+, 13]
      - [am2, 15]
      - [am2+, 15]
      - [am3, 16]
      - [am3+, 16]
      - [pm1, 16]
      - [pm1+, 16]
      - [pm2, 15]
      - [pm2+, 15]
      - [pm3, 13]
      - [pm3+, 13]
      - [long, 23]
      - [long+, 23]
      - [night, 23]
      - [night+, 23]
      - [LEAVE, 16]
    expression: ["x >= T", "x <= T"]
    target: [304, 336]
    weight: .inf
    hoursContract:
      unit: half-hour
      policy: range

  # ================================================================ requests ==
  # What the ward actually receives before a roster is written: approved annual
  # leave, a few days people genuinely cannot work, and softer preferences the
  # roster honours where it can.
  #
  # Three different strengths are in use here, and the difference matters:
  #
  #   LEAVE            always a hard pin, whatever weight is given. The nurse is
  #                    on paid leave that day and cannot be rostered.
  #   OFF, weight .inf a hard day off. Not leave: it earns no hours, so the nurse
  #                    must still reach 152 h from fewer available days.
  #   OFF, weight 30.. a preference. The solver gives the day off when it can and
  #                    overrides it when the ward cannot be staffed otherwise.
  #                    Nothing at a finite weight can make the roster infeasible.
  #
  # Leave is budgeted (see the header): 40 days across the ward puts credited
  # hours mid-band. Blocks run 2-7 days, which is what a real request sheet looks
  # like over four weeks - nobody takes the whole roster off.

  # -------------------------------------------------- approved annual leave --
  - type: shift request
    description: SSN-Priya - annual leave, first week
    person: SSN-Priya
    date: [2026-10-01, 2026-10-02, 2026-10-03, 2026-10-04, 2026-10-05]
    shiftType: LEAVE
  - type: shift request
    description: SSN-Farah - annual leave
    person: SSN-Farah
    date: [2026-10-03, 2026-10-04, 2026-10-05, 2026-10-06, 2026-10-07]
    shiftType: LEAVE
  - type: shift request
    description: SN-Geetha - two days annual leave
    person: SN-Geetha
    date: [2026-10-06, 2026-10-07]
    shiftType: LEAVE
  - type: shift request
    description: SN-Kamala - annual leave, second week
    person: SN-Kamala
    date: [2026-10-08, 2026-10-09, 2026-10-10, 2026-10-11, 2026-10-12]
    shiftType: LEAVE
  - type: shift request
    description: SN-LiPing - annual leave
    person: SN-LiPing
    date: [2026-10-10, 2026-10-11, 2026-10-12, 2026-10-13, 2026-10-14]
    shiftType: LEAVE
  - type: shift request
