# Four-week ward roster over eight shift patterns, with a Senior Staff Nurse on
# every shift, and a realistic sheet of leave and day-off requests.
#
# GRADES
# ------
#   SSN-<name>  Senior Staff Nurse - may fill a senior-only (+) slot   (18 of 32)
#   SN-<name>   Staff Nurse                                            (14 of 32)
# The prefix on a nurse's id IS the grade; nothing else marks it, and the
# SeniorStaffNurses group must list every SSN or the senior rule silently covers
# fewer people than it looks like it does.
#
# HOW THE SENIOR RULE IS BUILT
# ----------------------------
# Each of the eight patterns is declared TWICE: `am1` is open to anyone, `am1+`
# is the same hours reserved for a Senior Staff Nurse via `qualifiedPeople`.
# Staffing then asks for N on the open slot and exactly 1 on the `+` slot, so
# "every shift has a senior on it" holds by construction and the senior is
# visible in the roster rather than being something you audit for afterwards.
# (`qualifiedPeople` cannot express "at least one of these" -- it EXCLUDES
# everyone else -- which is why the senior needs its own slot. The same `+`
# convention is used by large-ward-with-87-people-2025-11.yaml.)
#
# This has a consequence worth seeing: a senior is needed on 8 patterns every
# day, and a nurse works about 9 days in 14, so the ward needs at least 12
# seniors and comfortably more. That is why 18 of the 32 nurses are SSN. It falls
# out of the rule, it was not chosen for flavour.
#
# WHY THE CLOCK TIMES MATTER
# --------------------------
# The solver works in whole days. `startTime`/`endTime`/`restMinutes` are
# authoring-only and it never reads them (see models.ShiftType), so every
# hours-based rest rule below was worked out from these times by hand and then
# written as a banned run of days. Change a start or end time and the rules stop
# meaning what they say.
#
# Gaps from one day to the next (the rules exist to remove the starred ones):
#
#              -> 08:00   12:00   13:00   14:00   20:00
#   am1  15:00     17.0    21.0    22.0    23.0    29.0
#   am2  16:00     16.0    20.0    21.0    22.0    28.0
#   am3  17:00     15.0    19.0    20.0    21.0    27.0
#   pm1  21:00    *11.0    15.0    16.0    17.0    23.0
#   pm2  21:00    *11.0    15.0    16.0    17.0    23.0
#   pm3  21:00    *11.0    15.0    16.0    17.0    23.0
#   long 20:30    *11.5    15.5    16.5    17.5    23.5
#   night 08:30   *-0.5    *3.5    *4.5    *5.5    11.5   (finishes NEXT morning)
#
# Two consequences that are easy to miss:
#   * A 21:00 finish into an 08:00 start is exactly 11.0 h. That clears the legal
#     floor, so no interval rule catches it -- it is banned separately.
#   * A night finishes 08:30, so two clear days then an 08:00 start is only
#     47.5 h, half an hour short of the 48 h a night run needs. The third day
#     therefore bans 08:00 starts as well; an afternoon start is 51.5 h and fine.
#
# THE NUMBERS
# -----------
#   20 shifts a day (8 of them senior-only) = 172 paid hours a day
#   x 28 days = 4816 paid hours of work to place
#   + 40 approved leave days credited at 8 h = 5136 h credited in total
#   over 32 nurses = 160.5 h each, inside the 152-168 h band (avg 40 h a week)
#
#   The band is a range rather than a fixed figure because the eight patterns run
#   from 6.5 h to 11.5 h, so an exact total would only be reachable for certain
#   combinations of shifts.
#
#   LEAVE IS BUDGETED, NOT FREE. Credited hours = 4816 + 8 x (leave days), and
#   that must land inside 32 x 152-168 h = 4864-5376 h, so leave has to sit
#   between 6 and 70 days across the ward. Below 6 the ward cannot reach its
#   minimum hours; above 70 it cannot stay under the maximum. Either way the
#   solver just returns INFEASIBLE with nothing pointing at leave as the cause,
#   so change headcount and leave together. The 40 days rostered here sit
#   mid-band, leaving room to add or move leave without re-planning the ward.
#
# EDITABLE IN THE WEB APP
# -----------------------
# No pattern uses a multi-value position, because the successions pattern builder
# appends exactly one token per position. Groups do the work instead. Keep it that
# way: a nested position still solves, but the card becomes read-only in the UI.
#
# Lives in testcases/real/ so it is excluded from the CSV-exact regression sweep
# (schedule_test_helper.EXCLUDED_TESTCASE_DIRS): a ward this size has no unique
# optimal roster, which that sweep requires.

apiVersion: alpha
description: >-
  Four-week ward roster over eight shift patterns (three morning, three afternoon,
  a long day and a night), where every shift on every day must include at least
  one Senior Staff Nurse. Enforces an 11-hour minimum break between shifts, a
  ban on early starts straight after a late finish, a 48-hour recovery window
  after a run of nights, and one rest day of at least 30 unbroken hours a week.
country: SG

dates:
  range:
    startDate: 2026-10-01
    endDate: 2026-10-28

shiftTypes:
  items:
    - id: am1
      description: Early morning 08:00-15:00, 30 min unpaid break, 6h30 paid (open to any nurse)
      startTime: "08:00"
      endTime: "15:00"
      restMinutes: 30
      durationMinutes: 390
