  groups:
    # Each group covers a shift pattern AND its senior-only twin, so a rule
    # written against the group applies to both.
    - id: AllMornings
      description: Every morning shift
      members: [am1, am1+, am2, am2+, am3, am3+]
    - id: AllAfternoons
      description: Every afternoon shift
      members: [pm1, pm1+, pm2, pm2+, pm3, pm3+]
    - id: AllLongDays
      description: Every long day shift
      members: [long, long+]
    - id: AllNights
      description: Every night shift
      members: [night, night+]
    - id: StartsAt0800
      description: Every shift that starts at 08:00
      members: [AllMornings, AllLongDays]
    - id: FinishesLate
      description: Every shift that finishes at 20:30 or 21:00
      members: [AllAfternoons, AllLongDays]
    - id: AnyDayShift
      description: Every shift that is not a night
      members: [AllMornings, AllAfternoons, AllLongDays]

